[workspace]
resolver = "3"
members = [
    "crates/smeagol-harness-core",
    "crates/smeagol-harness-store",
    "crates/smeagol-harness-setup",
    "crates/smeagol-harness-hooks",
    "crates/smeagol-harness-consolidate",
    "crates/smeagol-harness-cli",
]
default-members = ["crates/smeagol-harness-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
smeagol-harness-core = { path = "crates/smeagol-harness-core" }
smeagol-harness-store = { path = "crates/smeagol-harness-store" }
smeagol-harness-setup = { path = "crates/smeagol-harness-setup" }
smeagol-harness-hooks = { path = "crates/smeagol-harness-hooks" }
smeagol-harness-consolidate = { path = "crates/smeagol-harness-consolidate" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
